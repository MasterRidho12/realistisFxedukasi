<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- White Version Logo for Dark Green & Dark Backgrounds -->
  <defs>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Emblem Icon Container with semi-transparent frosted white border -->
  <rect x="4" y="6" width="48" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.15" filter="url(#whiteGlow)" />
  <rect x="5" y="7" width="46" height="46" rx="13" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- Candlestick Trend Motif in Crisp White -->
  <!-- Candle 1 -->
  <line x1="18" y1="22" x2="18" y2="38" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <rect x="16" y="26" width="4" height="8" rx="1" fill="#FFFFFF" />

  <!-- Candle 2 -->
  <line x1="28" y1="18" x2="28" y2="42" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <rect x="26" y="22" width="4" height="13" rx="1" fill="#FFFFFF" />

  <!-- Dynamic Trend Arrow in Accent Mint Green -->
  <path d="M 22 34 L 30 26 L 36 30 L 44 18" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="39,18 44,18 44,23" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Brand Typography in Pure White -->
  <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="0.5" fill="#FFFFFF">REALISTIS</text>
  <text x="174" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="0.5" fill="#4ADE80">FX</text>
  
  <!-- Pill Subtitle: EDUKASI in White Accent -->
  <rect x="62" y="38" width="68" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.2" />
  <text x="68" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="9" letter-spacing="1" fill="#FFFFFF">EDUKASI</text>
  <text x="136" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9" letter-spacing="0.5" fill="#CBD5E1">SOP ANTI-MC</text>
</svg>